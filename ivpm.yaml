package:
    name: pyucis-viewer

    dep-sets:
    - name: default-dev
      deps:
      - name: pyqt5
        src: pypi
      - name: pyucis
        url: https://github.com/fvutils/pyucis.git
      - name: pylint
        src: pypi
      - name: flake8
        src: pypi
      - name: pytest
        src: pypi
      - name: pytest-cov
        src: pypi
      - name: sphinx
        src: pypi
      - name: sphinx-rtd-theme
        src: pypi
      - name: sphinx-argparse
        src: pypi
    - name: default
      deps:
      - name: pyucis
        src: pypi
      - name: pyqt5
        src: pypi

